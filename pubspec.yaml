name: market
description: "Marketplace app - Buy & Sell"
publish_to: 'none'
# versionName+versionCode, read by the build as `flutter.versionName` and
# `flutter.versionCode`. Bump it with `tool/bump_version.sh` before every
# release build: Play rejects a bundle whose versionCode it has already seen.
version: 1.0.3+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_staggered_animations: ^1.1.1
  badges: ^3.1.2
  http: ^1.6.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.2.5
  webview_flutter: ^4.13.1
  photo_view: ^0.15.0
  crop_your_image: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
